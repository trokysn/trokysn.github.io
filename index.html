async function order(id){
 if(need())return;

 const buy=o.buyer_id===S.me.id,sel=o.seller_id===S.me.id,st=o.status;let act='';
 const steps=[['Paiement',['payee','expediee','recue','terminee']],['Expédition',['expediee','recue','terminee']],['Réception',['recue','terminee']],['Terminée',['terminee']]];
 if(buy&&st==='en_attente_paiement'&&o.group_id)act=`<div class="box">Cet article fait partie d’un paiement commun.</div><a class="btn a" href="#/g/${o.group_id}">Voir le paiement</a>`;
 else if(buy&&st==='en_attente_paiement')act=pay.length?'<div class="box">Paiement déclaré. Il sera confirmé dès réception de l’argent.</div>':`<div class="box"><b>Payer ${F(o.item_price)}</b><br>Envoyez ce montant par <b>${esc(S.cfg.payment_operator)}</b> au <b>${esc(S.cfg.payment_number)}</b>, au nom de <b>${esc(S.cfg.payment_name||'Troky SN')}</b>, avec la référence <b>${o.ref}</b>.<div class="row"><button class="btn s o" id="cn">Copier le numéro</button><button class="btn s o" id="ca">Copier le montant</button></div>${waveBtn(o)}</div>

 if(sel&&st==='payee')act='<button class="btn" id="sh">Article expédié</button>';
 if(buy&&st==='expediee')act='<button class="btn" id="rc">Réception confirmée</button>';
 if(buy&&['payee','expediee'].includes(st))act+='<button class="btn o" id="ds">Signaler un problème</button>';
 if(sel&&!S.p.payout_number)act+='<p class="er">Renseignez votre numéro de réception dans Profil pour être payé.</p>';
 shell(`<a class="bk" href="#/orders">← Commandes</a><h2>${esc(o.listings?.title||'Commande')}</h2><p class="mu">${o.ref} · <span class="tag">${ST[st]}</span></p>
 <div class="box">${ov(o)?`${ov(o)}<br>`:''}Prix ${F(o.item_price)}${sel?`<br>Commission Troky ${F(o.commission)}<br><b>Vous recevez ${F(o.seller_amount)}</b>`:''}</div>
 <div class="steps">${steps.map(([n,a])=>`<div class="${a.includes(st)?'ok':''}"><i></i>${n}</div>`).join('')}</div>
 ${st==='expediee'&&o.auto_validate_at?`<p class="mu">Validation automatique le ${new Date(o.auto_validate_at).toLocaleDateString('fr-FR')} sans signalement.</p>`:''}${act}`,'/orders');
 const rpc=async(n,a)=>{const {error}=await SB.rpc(n,a);if(error)alert(error.message);order(id)};
 const cp=(b,t)=>{const lb=b.textContent;navigator.clipboard.writeText(t).then(()=>{b.textContent='Copié';setTimeout(()=>{b.textContent=lb},1500)},()=>alert(t))};
 if($('#cn'))$('#cn').onclick=e=>cp(e.target,String(S.cfg.payment_number||'').replace(/\s/g,''));
 if($('#ca'))$('#ca').onclick=e=>cp(e.target,String(o.item_price));
 if($('#pd'))$('#pd').onclick=()=>{const rf=$('#rf').value.trim();if(!rf)return alert('Indiquez la référence de la transaction.');rpc('buyer_declare_paid',{p_order:id,p_operator:$('#op').value,p_reference:rf})};
 if($('#sh'))$('#sh').onclick=()=>rpc('seller_mark_shipped',{p_order:id});

 if($('#ds'))$('#ds').onclick=()=>{const r=prompt('Décrivez le problème');if(r)rpc('buyer_open_dispute',{p_order:id,p_reason:r})};
}

function authView(){
 let su=false;
 const draw=()=>{shell(`<h2>${su?'Créer mon compte':'Connexion'}</h2>
 ${su?'<label>Nom complet<input id="n" class="in"></label><label>Téléphone<input id="ph" class="in" inputmode="tel"></label><label>Ville<input id="ci" class="in"></label>':''}
 <label>Adresse e-mail<input id="em" class="in" type="email"></label><label>Mot de passe${su?' (6 caractères minimum)':''}<input id="pw" class="in" type="password" ${su?'minlength="6" autocomplete="new-password"':'autocomplete="current-password"'}></label>${su?'<span class="hint" id="pwh">Au moins 6 caractères.</span>':''}
 <button class="btn" id="ok">${su?'Créer mon compte':'Se connecter'}</button>${su?'':'<button class="lk" id="fg">Mot de passe oublié ?</button>'}<button class="lk" id="sw">${su?'J’ai déjà un compte':'Créer un compte'}</button>`,'/profile');
  $('#sw').onclick=()=>{su=!su;draw()};
  if($('#fg'))$('#fg').onclick=()=>forgotView($('#em').value.trim());
  const pwOk=v=>v.length>=6&&v.trim().length>0,pwShow=force=>{const h=$('#pwh');if(!h)return;const v=$('#pw').value,ok=pwOk(v),n=6-v.length;h.className='hint '+(ok?'good':(v||force)?'bad':'');h.textContent=ok?'Mot de passe valide.':n>0?(v?`Encore ${n} caractère${n>1?'s':''}.`:'Au moins 6 caractères.'):'Le mot de passe ne peut pas contenir que des espaces.'};
  if(su)$('#pw').oninput=()=>pwShow();
  $('#ok').onclick=async()=>{const email=$('#em').value.trim(),password=$('#pw').value;
   if(su){const n=$('#n').value.trim();if(!pwOk(password)){pwShow(true);$('#pw').focus();return}if(!n||!email)return alert('Complétez le nom et l’e-mail.');
    const {data,error}=await SB.auth.signUp({email,password,options:{emailRedirectTo:'https://trokysn.github.io/',data:{full_name:n,phone:$('#ph').value.trim(),city:$('#ci').value.trim()}}});
    if(error)return alert(/password/i.test(error.message)?'Le mot de passe doit contenir au moins 6 caractères.':error.message);
    if(data.session){location.hash='/';location.reload()}else{alert('Compte créé. Ouvrez le lien reçu par e-mail pour confirmer votre adresse, puis connectez-vous.\n\nVérifiez vos e-mails et vos spams.');su=false;draw()}
   }else{const {error}=await SB.auth.signInWithPassword({email,password});if(error)return alert('E-mail ou mot de passe incorrect.');location.hash='/';location.reload()}}};
 draw();
}

 const t=prompt('Votre compte, vos annonces et vos données personnelles seront supprimés. Cette action est définitive.\n\nPour confirmer, écrivez SUPPRIMER');
 if(t===null)return;if(t.trim().toUpperCase()!=='SUPPRIMER')return alert('Compte conservé : le mot saisi n’est pas correct.');
 const {data:ls}=await SB.from('listings').select('id').eq('seller_id',S.me.id).neq('status','vendue');
 const paths=(ls||[]).flatMap(l=>[0,1,2,3,4].map(i=>`${S.me.id}/${l.id}/${i}.jpg`));
 if(paths.length)await SB.storage.from('listing-photos').remove(paths);
 const {error}=await SB.rpc('delete_my_account',{p_dry_run:false});if(error)return alert(error.message);
 await SB.auth.signOut({scope:'local'});alert('Votre compte a été supprimé.');location.hash='/';location.reload();
}

async function admin(){
 if(!S.p||S.p.role!=='admin')return go('/');
 const [L,O,P,PR,DS,PM,CT,G,PG]=await Promise.all([
  SB.from('listings').select('*,listing_photos(url,position),listing_variants(*)').eq('status','en_attente').order('created_at'),
  SB.from('orders').select('*,listings(title)').eq('status','en_attente_paiement').order('created_at'),
  SB.from('payouts').select('*,orders(ref,variant_label,quantity,listings(title))').eq('status','a_faire'),
  SB.from('profiles').select('id,full_name,phone,payout_operator,payout_number'),
  SB.from('orders').select('*,listings(title)').eq('status','litige'),
  SB.from('payments').select('*').eq('status','declare'),
  SB.from('profiles').select('id',{count:'exact',head:true}).neq('status','deleted'),
  SB.from('checkout_groups').select('*'),
  SB.from('orders').select('seller_id,seller_amount').in('status',['payee','expediee','litige'])]);
 const prof=id=>PR.data.find(p=>p.id===id)||{};
 const accts=id=>{const p=prof(id);return p.payout_number?`${esc(p.payout_operator||'?')} · ${esc(p.payout_number)}`:'<span class="er">numéro manquant</span>'};
 const pend=O.data.filter(o=>o.group_id),groups=(G.data||[]).map(g=>({g,os:pend.filter(o=>o.group_id===g.id)})).filter(x=>x.os.length);
 const groupCard=({g,os})=>{const by={};os.forEach(o=>{(by[o.seller_id]=by[o.seller_id]||{n:0,a:0,c:0,p:0});const b=by[o.seller_id];b.n++;b.a+=o.seller_amount;b.c+=o.commission;b.p+=o.item_price});const tot=os.reduce((a,o)=>a+o.item_price,0),com=os.reduce((a,o)=>a+o.commission,0),net=os.reduce((a,o)=>a+o.seller_amount,0),dec=[...new Set(os.flatMap(o=>(PM.data||[]).filter(p=>p.order_id===o.id).map(p=>`${esc(p.operator)} · réf. ${esc(p.reference)}`)))].join(', ')||'Aucun paiement déclaré';
  return `<div class="box"><b>${esc(g.ref)}</b> · acheteur ${nm(g.buyer_id)}<br><b>${F(tot)}</b> à recevoir<br><small>${dec}</small>
  <table class="pay"><thead><tr><th>Vendeur</th><th>Articles</th><th>À verser</th></tr></thead><tbody>${Object.entries(by).map(([id,b])=>`<tr><td>${nm(id)}<small>${accts(id)}</small></td><td>${b.n}</td><td>${F(b.a)}</td></tr>`).join('')}</tbody><tfoot><tr><td>Total vendeurs</td><td></td><td>${F(net)}</td></tr><tr><td>Commission Troky</td><td></td><td>${F(com)}</td></tr></tfoot></table>
  <div class="row">${bt('paidg',g.id,'Paiement reçu')}${bt('cancelg',g.id,'Annuler',1)}</div></div>`};
 const sellerIds=[...new Set([...P.data.map(p=>p.seller_id),...(PG.data||[]).map(o=>o.seller_id)])];
 const owed=sellerIds.map(id=>({id,now:P.data.filter(p=>p.seller_id===id).reduce((a,p)=>a+p.amount,0),soon:(PG.data||[]).filter(o=>o.seller_id===id).reduce((a,o)=>a+o.seller_amount,0)}));
 const owedTable=()=>owed.length?`<table class="pay"><thead><tr><th>Vendeur</th><th>À verser maintenant</th><th>Plus tard</th></tr></thead><tbody>${owed.map(x=>`<tr><td>${nm(x.id)}<small>${accts(x.id)}</small></td><td>${F(x.now)}</td><td>${F(x.soon)}</td></tr>`).join('')}</tbody><tfoot><tr><td>Total</td><td>${F(owed.reduce((a,x)=>a+x.now,0))}</td><td>${F(owed.reduce((a,x)=>a+x.soon,0))}</td></tr></tfoot></table><p class="mu"><small>« Plus tard » : articles payés, en attente de réception ou en litige.</small></p>`:'<p class="mu">Aucun montant à verser.</p>';
 const payoutCards=()=>[...new Set(P.data.map(p=>p.seller_id))].map(id=>{const ps=P.data.filter(p=>p.seller_id===id),t=ps.reduce((a,p)=>a+p.amount,0);return `<div class="box"><b>${F(t)}</b> pour ${nm(id)}<br>${accts(id)}${ps.map(p=>`<div class="lin"><span>${esc(p.orders?.ref)} · ${esc(p.orders?.listings?.title||'')}${p.orders&&ov(p.orders)?` · ${ov(p.orders)}`:''}</span><b>${F(p.amount)}</b></div>${bt('pay',p.id,'Reversement fait',1)}`).join('')}${ps.length>1?`<button class="btn s" data-f="payall" data-id="${id}" data-amt="${t}">Tout marquer comme versé (${F(t)})</button>`:''}</div>`});
 const nm=id=>esc((PR.data.find(p=>p.id===id)||{}).full_name||'?'),pm=id=>(PM.data||[]).filter(p=>p.order_id===id).map(p=>`${esc(p.operator)} · réf. ${esc(p.reference)}`).join(', ')||'Aucun paiement déclaré';
 const bt=(f,id,t,o)=>`<button class="btn s ${o?'o':''}" data-f="${f}" data-id="${id}">${t}</button>`;
 const sec=(t,a,e)=>`<h3>${t} (${a.length})</h3>${a.join('')||`<p class="mu">${e}</p>`}`;
 shell(`<a class="bk" href="#/profile">← Profil</a><h2>Administration</h2>
 <div class="stat"><b>${CT.count??'?'}</b>personnes inscrites<br><small style="color:#F6E3C8">Y compris les e-mails pas encore confirmés.</small></div>
 ${sec('Annonces à valider',L.data.map(l=>`<div class="box"><div class="row2"><a href="#/l/${l.id}" class="th">${ph(l)}</a><div><b>${esc(l.title)}</b><br>${F(l.price)} · ${nm(l.seller_id)}<br><small>${esc(l.description).slice(0,120)}</small>${l.size_label?`<br><small>Taille : ${esc(l.size_label)}</small>`:''}${isStock(l)?vars(l).map(v=>`<br><small>${esc(v.label)} : ${F(v.price)} · ${v.stock===null?'sans limite':v.stock+' en stock'}</small>`).join(''):''}</div></div><div class="row">${bt('ok',l.id,'Publier')}${bt('no',l.id,'Refuser',1)}</div></div>`),'Rien à valider.')}
 ${sec('Paiements communs à confirmer',groups.map(groupCard),'Aucun paiement commun en attente.')}
 ${sec('Paiements à confirmer',O.data.filter(o=>!o.group_id).map(o=>`<div class="box"><b>${o.ref}</b> · ${esc(o.listings?.title)}${ov(o)?` · ${ov(o)}`:''}<br>${F(o.item_price)} · acheteur ${nm(o.buyer_id)}<br><small>${pm(o.id)}</small><div class="row">${bt('paid',o.id,'Paiement reçu')}${bt('cancel',o.id,'Annuler',1)}</div></div>`),'Aucun paiement en attente.')}
 <h3>Montant à verser à chaque vendeur</h3>${owedTable()}
 ${sec('Reversements à faire',payoutCards(),'Aucun reversement.')}
 ${sec('Litiges',DS.data.map(o=>`<div class="box"><b>${o.ref}</b> · ${esc(o.listings?.title)}${ov(o)?` · ${ov(o)}`:''} · ${F(o.item_price)}<div class="row">${bt('refund',o.id,'Rembourser l’acheteur')}${bt('seller',o.id,'Payer le vendeur',1)}</div></div>`),'Aucun litige.')}
 <h3>Réglages</h3><label>Opérateur de paiement<input id="s_payment_operator" class="in" value="${esc(S.cfg.payment_operator)}"></label><label>Numéro de paiement<input id="s_payment_number" class="in" value="${esc(S.cfg.payment_number)}"></label>
 <label>Nom affiché au client pour le paiement<input id="s_payment_name" class="in" value="${esc(S.cfg.payment_name||'Troky SN')}"></label><label>Lien de paiement Wave Business (facultatif)<input id="s_wave_pay_link" class="in" placeholder="https://..." value="${esc(S.cfg.wave_pay_link)}"></label>
 <label>Commission (0.08 = 8 %)<input id="s_commission_rate" class="in" value="${esc(S.cfg.commission_rate)}"></label><label>Validation automatique (jours)<input id="s_auto_validate_days" class="in" value="${esc(S.cfg.auto_validate_days)}"></label>
 <button class="btn" data-f="cfg">Enregistrer les réglages</button>
 <h3>Images de la bannière d’accueil</h3><div class="ban">${heroList().map((u,i)=>`<div><img src="${esc(u)}" alt=""><button class="btn s o" data-f="hdel" data-id="${i}">Retirer</button></div>`).join('')||'<p class="mu">Aucune image pour le moment.</p>'}</div><label>Ajouter des images<input id="hf" class="in" type="file" accept="image/*" multiple></label><button class="btn o" data-f="auto">Lancer la validation automatique</button>`,'/profile');
 $('#hf').onchange=async e=>{const fs=[...e.target.files];if(!fs.length)return;e.target.disabled=true;
  try{const a=heroList();for(const f of fs){const path=`${S.me.id}/banniere/${Date.now()}-${a.length}.jpg`,{error:e1}=await SB.storage.from('listing-photos').upload(path,await shrink(f),{contentType:'image/jpeg'});if(e1)throw e1;a.push(SB.storage.from('listing-photos').getPublicUrl(path).data.publicUrl)}
   const {error:e2}=await saveCfg('hero_images',JSON.stringify(a));if(e2)throw e2;await boot();admin()}catch(x){alert(x.message);e.target.disabled=false}};
}
const saveCfg=(key,value)=>SB.from('settings').upsert({key,value});
A.onclick=async e=>{
 const b=e.target.closest('[data-f]');if(!b)return;const f=b.dataset.f,id=b.dataset.id;let n,a={};
 if(f==='cfg'){for(const k of['payment_operator','payment_number','payment_name','wave_pay_link','commission_rate','auto_validate_days']){const {error}=await saveCfg(k,$('#s_'+k).value.trim());if(error)return alert(error.message)}await boot();alert('Réglages enregistrés.');return admin()}
 if(f==='payall'){const r=prompt('Vous confirmez avoir versé '+F(b.dataset.amt)+' à ce vendeur ?\nRéférence du transfert (facultatif)');if(r===null)return;const {data:ps,error:e0}=await SB.from('payouts').select('id').eq('seller_id',id).eq('status','a_faire');if(e0)return alert(e0.message);for(const x of ps){const {error}=await SB.rpc('admin_complete_payout',{p_payout:x.id,p_ref:r||null});if(error){alert(error.message);break}}return admin()}
 if(f==='hdel'){const a=heroList(),[u]=a.splice(+id,1),{error}=await saveCfg('hero_images',JSON.stringify(a));if(error)return alert(error.message);const m=String(u).split('/listing-photos/')[1];if(m)await SB.storage.from('listing-photos').remove([decodeURIComponent(m)]);await boot();return admin()}
 if(f==='ok'){n='admin_review_listing';a={p_listing:id,p_approve:true}}
 else if(f==='no'){const r=prompt('Motif du refus');if(!r)return;n='admin_review_listing';a={p_listing:id,p_approve:false,p_reason:r}}
 else if(f==='paid'){n='admin_mark_paid';a={p_order:id}}
 else if(f==='paidg'){if(!confirm('Avez-vous bien reçu la totalité de ce paiement ?'))return;n='admin_mark_group_paid';a={p_group:id}}
 else if(f==='cancelg'){if(!confirm('Annuler tout ce paiement commun ?'))return;n='admin_cancel_group';a={p_group:id}}
 else if(f==='cancel'){if(!confirm('Annuler cette commande ?'))return;n='admin_cancel_order';a={p_order:id}}
 else if(f==='pay'){const r=prompt('Référence du transfert (facultatif)');if(r===null)return;n='admin_complete_payout';a={p_payout:id,p_ref:r||null}}
 else if(f==='refund'||f==='seller'){n='admin_resolve_dispute';a={p_order:id,p_refund:f==='refund'}}
 else if(f==='auto')n='auto_validate_orders';else return;
 const {data,error}=await SB.rpc(n,a);if(error)return alert(error.message);if(f==='auto')alert(data+' commande(s) validée(s).');admin();
};

boot().then(()=>{S.ready=true;
 if(HASH0.includes('otp_expired')){alert('Ce lien a expiré ou a déjà été utilisé. Demandez-en un nouveau.');history.replaceState(null,'',location.pathname+'#/profile')}
 route()});
